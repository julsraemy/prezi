<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IIIF Image Viewer</title>
<!-- Zoomable IIIF Image API viewer for embedding in the decks:
     assets/iiif-image.html?url=<info.json URL>
     Same stack as phd.julsraemy.ch (Leaflet + Leaflet-IIIF). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { background: #111; color: #eee; font: 16px/1.4 system-ui, sans-serif; }
  #map { background: #111; }
  .message { display: grid; place-items: center; height: 100%; padding: 1em; text-align: center; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-iiif@3.0.0/leaflet-iiif.js"></script>
<script>
  (function () {
    var el = document.getElementById("map");
    var info = new URLSearchParams(location.search).get("url");
    function fail(text) { el.innerHTML = '<div class="message"></div>'; el.firstChild.textContent = text; }
    if (!info || !/^https?:\/\//.test(info)) return fail("Add ?url=<IIIF info.json URL> to show an image.");
    if (!window.L || !L.tileLayer.iiif) return fail("The viewer could not be loaded.");
    var map = L.map(el, { center: [0, 0], crs: L.CRS.Simple, zoom: 0, attributionControl: false });
    L.tileLayer.iiif(info, { fitBounds: true }).addTo(map);
  })();
</script>
</body>
</html>
