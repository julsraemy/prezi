      "@id": "https://julsraemy.ch/prezi/loud4ch-biblissima.html",
      "name": "LOUD et clair : comment les normes communautaires transforment l’engagement du public dans le patrimoine culturel",
      "description": "Le Linked Open Usable Data (LOUD) représente une démarche et des principes de conception proposés par Robert Sanderson pour rendre les données patrimoniales plus facilement exploitables, en premier lieu par les développeurs de logiciels. Cette présentation, issue d'une recherche doctorale, explore comment ces principes – incarnés par IIIF (https://iiif.io) et Linked Art (https://linked.art) – transforment progressivement l'accès au patrimoine culturel grâce à des pratiques collaboratives et ouvertes. LOUD repose sur cinq principes de conception : privilégier les cas d'usage sur la rigueur ontologique, réduire les obstacles à l'entrée, garantir la compréhension par simple consultation des données, fournir une documentation avec exemples concrets, et limiter les exceptions au profit de modèles cohérents. C'est par l'intermédiaire des développeurs, et grâce à la facilité de compréhension des standards conformes à ces principes, que l'accessibilité pour les utilisateurs finaux est ensuite facilitée. Cette accessibilité se concrétise notamment à travers des visualiseurs (viewers) comme Mirador (https://projectmirador.org) ou Universal Viewer (https://universalviewer.io), qui deviennent de véritables outils de médiation entre les données structurées et le public. Ces interfaces offrent une expérience de navigation améliorée, permettant la comparaison d'images, l'annotation collaborative et la découverte enrichie des collections patrimoniales. Ils illustrent comment des standards bien conçus pour les développeurs se traduisent en expériences utilisateur de qualité. Si le potentiel est considérable, il reste encore du chemin à parcourir. C'est précisément là que réside la force de l'approche communautaire : les retours d'expérience partagés lors de réunions régulières, de groupes de travail et de conférences permettent de cristalliser des objectifs communs et d'améliorer continuellement les spécifications. Toutefois, la recherche révèle également des défis importants : l'homogénéité démographique des participants actifs – principalement issus d'institutions nord-américaines et européennes anglophones – soulève des questions quant à l'inclusivité et à la capacité de ces standards à répondre aux besoins de contextes culturels diversifiés. Or, les standards sont façonnés par ceux qui participent à leur élaboration. La présentation mettra en lumière comment cette démarche collaborative permet d'identifier les défis d'implémentation et d'accessibilité, tout en questionnant les dynamiques de pouvoir et d'inclusion nécessaires pour que ces standards bénéficient véritablement à l'ensemble du patrimoine culturel mondial.",

      "@id": "https://julsraemy.ch/prezi/cihn24-loud-catalyseur-convergence.html",
      "name": "LOUD – Catalyseur de Convergence",
      "description": "L'émergence du Linked Open Usable Data (LOUD) – littéralement « données ouvertes liées et utilisables » – représente un tournant dans la convergence des sciences de l'information et des humanités numériques. Ce concept innovant cherche à équilibrer la complétude et la précision des données avec leur accessibilité et utilité pour un public étendu. Historiquement, la connexion des données du patrimoine culturel a été entravée par des obstacles techniques et conceptuels. Les initiatives préexistantes se concentraient sur la rigueur ontologique, souvent au détriment de l'accessibilité et de l'usabilité des données pour les non-experts. Les projets Linked Open Data (LOD) étaient essentiellement axés sur la publication et la consommation de données pour un public d'experts en RDF (Resource Description Framework). L'introduction de JSON-LD en 2014 a réduit les barrières à l'entrée pour les développeurs, permettant une interprétation des données RDF en format JSON standard plus accessible. LOUD se distingue par ses principes de conception bien définis et ses spécifications basées sur JSON-LD. Il inclut des standards communautaires tels que l'API Présentation 3.0 de l'International Image Interoperability Framework (IIIF) et Linked Art ainsi que le Web Annotation Data Model du World Wide Web Consortium (W3C), orientant vers une meilleure accessibilité et interopérabilité des données. Ces principes couvrent a) la bonne abstraction en fonction du public, b) peu d'obstacles à l'entrée, c) compréhensibilité par introspection, d) documentation avec des exemples concrets, e) minimisation des exceptions et promotion de modèles cohérents. Les standards adhérants aux principes LOUD, en synergie, accroissent l'interopérabilité sémantique, même si cela peut impacter la pureté ontologique. Cette approche pragmatique facilite une meilleure utilisation et intégration des données du patrimoine culturel. LOUD peut également servir de fondements communs pour les institutions patrimoniales et les projets de recherche, offrant un cadre harmonisé pour la gestion des données culturelles. Malgré les défis d'adoption à grande échelle, l'exemple de Yale avec sa plateforme LUX, qui a été publiée officiellement en mai 2023, montre comment l'intégration des spécifications LOUD, notamment IIIF et Linked Art, peut améliorer l'interopérabilité et enrichir les données culturelles. LUX représente une application exemplaire des standards LOUD car la plateforme intègre les collections variées de l'université, incluant le Yale Center for British Art, la Yale University Art Gallery, le Yale Peabody Museum et la Yale University Library, totalisant quelque 41 millions de ressources. Cette intégration englobe des domaines tels que l'art, l'histoire naturelle, les catalogues de la bibliothèque et les données archivistiques. LUX se distingue par son architecture systémique comprenant la récolte et la réconciliation de données par le biais d'une chaîne de traitement automatique. Sa force réside dans sa capacité à intégrer des sources de données externes, offrant ainsi une richesse de perspectives et un enrichissement des données accessibles aux utilisateurs.LOUD émerge comme un catalyseur clé pour les sciences de l'information et les humanités numériques, équilibrant complétude, précision et accessibilité des données. L'approche illustrée par Yale démontre l'impact de LOUD dans l'amélioration de l'accès et de la valorisation des données du patrimoine culturel, marquant une avancée significative dans le domaine.",

      "@id": "https://julsraemy.ch/prezi/cihn24-loud-catalyst-convergence.html",
      "name": "LOUD – Catalyst of Convergence",
      "description": "The emergence of Linked Open Usable Data (LOUD) represents a turning point in the convergence of information science and digital humanities. This innovative concept seeks to balance the completeness and accuracy of data with their accessibility and utility for a broad audience. Historically, the connection of cultural heritage data has been hindered by technical and conceptual barriers. Pre-existing initiatives focused on ontological rigor, often at the expense of data accessibility and usability for non-experts. Linked Open Data (LOD) projects were primarily focused on the publication and consumption of data for an audience of experts in RDF (Resource Description Framework). The introduction of JSON-LD in 2014 lowered the barriers to entry for developers, enabling an interpretation of RDF data in a more accessible standard JSON format. LOUD stands out for its well-defined design principles and specifications based on JSON-LD. It includes community standards such as the International Image Interoperability Framework (IIIF) Presentation API 3.0 and Linked Art, as well as the World Wide Web Consortium's (W3C) Web Annotation Data Model, aiming for better data accessibility and interoperability. These principles cover a) The right Abstraction for the audience, b) fFew Barriers to entry, c) Comprehensible by introspection, d) Documentation with working examples, e) Few Exceptions, instead many consistent patterns Standards adhering to LOUD principles, in synergy, increase semantic interoperability, even if it may impact ontological purity. This pragmatic approach facilitates better use and integration of cultural heritage data. LOUD can also serve as common ground for heritage institutions and research projects, offering a harmonized framework for managing cultural data. Despite the challenges of large-scale adoption, Yale's example with its LUX platform, officially released in May 2023, shows how the integration of LOUD specifications, notably IIIF and Linked Art, can improve interoperability and enrich cultural data. LUX represents an exemplary application of LOUD standards as the platform integrates the university's diverse collections, including the Yale Center for British Art, the Yale University Art Gallery, the Yale Peabody Museum, and the Yale University Library, totaling some 41 million resources. This integration encompasses areas such as art, natural history, library catalogues, and archival data. LUX is distinguished by its systemic architecture, which includes harvesting and reconciling data through an automated data pipeline. Its strength lies in its ability to integrate external data sources, thus offering a wealth of perspectives and enriching the data accessible to users. LOUD emerges as a key catalyst for information science and digital humanities, balancing completeness, accuracy, and accessibility of data. Yale's approach demonstrates the impact of LOUD in improving access to and valorization of cultural heritage data, marking a significant advancement in the field.",

    {
      "@type": "PresentationDigitalDocument",
      "@id": "https://julsraemy.ch/prezi/loud-apis-studyday2023.html",
      "name": "Linked Open Usable Data (LOUD) APIs",
      "description": "This presentation is a \"data pitch\" done in the context of the DARIAH-CH Study Day 2023 in Bern, Switzerland. In my PhD thesis titled \"Linked Open Usable Data for Cultural Heritage\", I address the challenge of establishing and studying stable application programming interfaces (APIs) for cultural heritage data. This endeavour aims to enable seamless integration and interoperability, thereby fostering collaboration and accessibility across the domain. However, I encounter a particular hurdle on this journey, as my work is often perceived by existing infrastructures as a service rather than an object of study. During the Community Practices phase of my research, I have adopted a comprehensive approach that combines observations, semi-structured interviews and online surveys. This interweaving of methods allows me to gain valuable insights. I am also actively immersed in the International Image Interoperability Framework (IIIF) and Linked Art communities, using an Actor-Network Theory (ANT) lens to unravel the intricate dependencies and relationships between the various actors. In venturing into the realm of semantic interoperability, I have embarked on a journey of experimentation with modelling, publishing and analysing LOUD-compliant resources, with a key focus on implementing RESTful APIs. These intertwined perspectives are based on the LOUD design principles and leverage JSON-LD as a serialisation format, ensuring adherence to core standards such as the IIIF Presentation API 3.0, W3C Web Annotation Data Model, and Linked Art API. My dissertation presents a compelling set of use cases that highlight the inherent socio-technical characteristics of grassroots initiatives and the way they create and maintain specifications. First, within the confines of my own research, I endeavour to create a bespoke data model that is firmly rooted in LOUD practices. This foundational endeavour strengthens the integrity and coherence of my research within the broader landscape of the cultural heritage field. Secondly, working with Participatory Knowledge Practices in Analogue and Digital Image Archives (PIA) as a dynamic laboratory, I confront the intricacies of data modelling, drawing on practical engagement and reflective contemplation to refine my findings. Finally, an incisive analysis of LUX, the Yale Collection Discovery platform, provides valuable insights into the effective implementation of LOUD standards at scale, highlighting the nuances of data consistency. As I navigate this interdisciplinary expedition, I encounter the intriguing insight that both community practices and semantic interoperability are intricately intertwined. Instead of being distinct and isolated domains, they reveal themselves as interrelated threads, intricately woven together. This entanglement reveals the fluidity and symbiosis between these perspectives, where their convergence leads to a more holistic understanding of the intricate fabric of cultural heritage data. Traversing this distinctive path, I grapple with the captivating challenge of establishing LOUD API endpoints — a challenge diverging from conventional research subjects, which often necessitates self-reliance. In conclusion, my PhD unfolds as a journey that embraces intertwined socio-technical perspectives, showcasing their entanglement rather than discrete divisions.",

    {
      "@type": "PresentationDigitalDocument",
      "@id": "https://julsraemy.ch/prezi/libreabc2023.html",
      "name": "Créer des API ouvertes - les pratiques et le tissu social des communautés IIIF et Linked Art",
      "description": "Cette présentation a été réalisée dans le cadre de la journée LibreABC qui s'est déroulée le 31 août 2023 au Musée d'ethnographie de Genève. La création et la maintenance d’interfaces de programmation applicative (API - application programming interface) ouvertes et partagées est une pratique courante dans le développement de logiciels et de technologies de l'information. Les communautés IIIF (International Image Interoperability Framework Consortium) et Linked Art — composés principalement d'individus travaillant dans des bibliothèques, archives, musées et universités — sont des exemples de communautés qui ont adopté cette pratique avec succès. Cela favorise la collaboration et le développement de logiciels compatibles, tout en encourageant la transparence et l'ouverture. Les membres de ces communautés s'engagent à assurer la qualité et l'interopérabilité de leurs API en se basant sur des cas pratiques communs et sur des standards web ouverts. Les API des communautés IIIF et Linked Art présentent un potentiel énorme pour les utilisateur·rice·x·s, qu'iels soient universitaires ou membres du grand public. Grâce à ces API, les utilisateur·rice·x·s peuvent facilement accéder à des collections patrimoniales numériques, ce qui ouvre de nouvelles opportunités pour la recherche, l'éducation et la créativité. En fin de compte, les API ouvertes contribuent à la création d'un écosystème numérique collaboratif et dynamique, qui peut bénéficier à la société dans son ensemble.",

      "@type": "PresentationDigitalDocument",
      "@id": "https://julsraemy.ch/prezi/sts-ch-2023.html",
      "name": "Situating Interlinked Cultural Heritage Data on the Web",
      "description": "This presentation focuses on situating data produced by humans and nonhumans engaged in the cultural heritage field and published on the Web in line with the Open Science and Citizen Science movements. It aims to map the associations among various communities of practice, particularly within libraries, archives and museums, and the precarious balance between exhaustiveness and a rigid structure of data description versus the potential for multiplying assertions, bypassing cataloguing rules and their underlying postcolonial constructs. The openness and interconnection of data makes it possible to examine the form of description as well as the method of publication, and inevitably to analyse the biases linked to the associated vocabularies, For instance, the Web, which has claimed to be a Semantic Web for several years now, has a centrepiece known as Resource Description Framework (RDF), a general method for describing and exchanging graph data and a Web standard since 2004. The Semantic Web offers major opportunities for the Humanities because it allows data to be reasoned together, to be understood by machines via RDF-based ontologies, a formal way to represent human-like knowledge. Developing infrastructures, or sites of assemblage, capable of creating and maintaining RDF statements and other related technologies or building on this standard to interconnect online records is not straightforward and requires a fair amount of socio-technical elements to be implemented. As a demonstration, I will look at the practices of two community-driven initiatives, mainly active in the cultural heritage field, through an Actor-Network Theory (ANT) lens, namely the International Image Interoperability Framework (IIIF) and Linked Art, which have developed shared specifications and related services on agreed-upon design principles.",

un+enrichissement+des+donn%C3%A9es+accessibles+aux+utilisateurs.LOUD+%C3%A9merge+comme+un+catalyseur+cl%C3%A9+pour+les+sciences+de+l%27information+et+les+humanit%C3%A9s+num%C3%A9riques%2C+%C3%A9quilibrant+compl%C3%A9tude%2C+pr%C3%A9cision+et+accessibilit%C3%A9+des+donn%C3%A9es.+L%27approche+illustr%C3%A9e+par+Yale+d%C3%A9montre+l%27impact+de+LOUD+dans+l%27am%C3%A9lioration+de+l%27acc%C3%A8s+et+de+la+valorisation+des+donn%C3%A9es+du+patrimoine+culturel%2C+marquant+une+avanc%C3%A9e+significative+dans+le+domaine.&amp;rft_id=https%3A%2F%2Fjulsraemy.ch%2Fprezi%2Fcihn24-loud-catalyseur-convergence.html"></span>
<span class="Z3988" title="ctx_ver=Z39.88-2004&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Abook&amp;rft.genre=document&amp;rft.btitle=LOUD+%E2%80%93+Catalyst+of+Convergence&amp;rft.au=Julien+A.+Raemy&amp;rft.date=2024-02-13&amp;rft.place=Carouge%2C+Switzerland&amp;rft.description=The+emergence+of+Linked+Open+Usable+Data+%28LOUD%29+represents+a+turning+point+in+the+convergence+of+information+science+and+digital+humanities.+This+innovative+concept+seeks+to+balance+the+completeness+and+accuracy+of+data+with+their+accessibility+and+utility+for+a+broad+audience.+Historically%2C+the+connection+of+cultural+heritage+data+has+been+hindered+by+technical+and+conceptual+barriers.+Pre-existing+initiatives+focused+on+ontological+rigor%2C+often+at+the+expense+of+data+accessibility+and+usability+for+non-experts.+Linked+Open+Data+%28LOD%29+projects+were+primarily+focused+on+the+publication+and+consumption+of+data+for+an+audience+of+experts+in+RDF+%28Resource+Description+Framework%29.+The+introduction+of+JSON-LD+in+2014+lowered+the+barriers+to+entry+for+developers%2C+enabling+an+interpretation+of+RDF+data+in+a+more+accessible+standard+JSON+format.+LOUD+stands+out+for+its+well-defined+design+principles+and+specifications+based+on+JSON-LD.+It+includes+community+standards+such+as+the+International+Image+Interoperability+Framework+%28IIIF%29+Presentation+API+3.0+and+Linked+Art%2C+as+well+as+the+World+Wide+Web+Consortium%27s+%28W3C%29+Web+Annotation+Data+Model%2C+aiming+for+better+data+accessibility+and+interoperability.+These+principles+cover+a%29+The+right+Abstraction+for+the+audience%2C+b%29+fFew+Barriers+to+entry%2C+c%29+Comprehensible+by+introspection%2C+d%29+Documentation+with+working+examples%2C+e%29+Few+Exceptions%2C+instead+many+consistent+patterns+Standards+adhering+to+LOUD+principles%2C+in+synergy%2C+increase+semantic+interoperability%2C+even+if+it+may+impact+ontological+purity.+This+pragmatic+approach+facilitates+better+use+and+integration+of+cultural+heritage+data.+LOUD+can+also+serve+as+common+ground+for+heritage+institutions+and+research+projects%2C+offering+a+harmonized+framework+for+managing+cultural+data.+Despite+the+challenges+of+large-scale+adoption%2C+Yale%27s+example+with+its+LUX+platform%2C+officially+released+in+May+2023%2C+shows+how+the+integration+of+LOUD+specifications%2C+notably+IIIF+and+Linked+Art%2C+can+improve+interoperability+and+enrich+cultural+data.+LUX+represents+an+exemplary+application+of+LOUD+standards+as+the+platform+integrates+the+university%27s+diverse+collections%2C+including+the+Yale+Center+for+British+Art%2C+the+Yale+University+Art+Gallery%2C+the+Yale+Peabody+Museum%2C+and+the+Yale+University+Library%2C+totaling+some+41+million+resources.+This+integration+encompasses+areas+such+as+art%2C+natural+history%2C+library+catalogues%2C+and+archival+data.+LUX+is+distinguished+by+its+systemic+architecture%2C+which+includes+harvesting+and+reconciling+data+through+an+automated+data+pipeline.+Its+strength+lies+in+its+ability+to+integrate+external+data+sources%2C+thus+offering+a+wealth+of+perspectives+and+enriching+the+data+accessible+to+users.+LOUD+emerges+as+a+key+catalyst+for+information+science+and+digital+humanities%2C+balancing+completeness%2C+accuracy%2C+and+accessibility+of+data.+Yale%27s+approach+demonstrates+the+impact+of+LOUD+in+improving+access+to+and+valorization+of+cultural+heritage+data%2C+marking+a+significant+advancement+in+the+field.&amp;rft_id=https%3A%2F%2Fjulsraemy.ch%2Fprezi%2Fcihn24-loud-catalyst-convergence.html"></span>

<span class="Z3988" title="ctx_ver=Z39.88-2004&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Abook&amp;rft.genre=document&amp;rft.btitle=Linked+Open+Usable+Data+%28LOUD%29+APIs&amp;rft.au=Julien+A.+Raemy&amp;rft.date=2023-10-20&amp;rft.place=Bern%2C+Switzerland&amp;rft.description=This+presentation+is+a+%22data+pitch%22+done+in+the+context+of+the+DARIAH-CH+Study+Day+2023+in+Bern%2C+Switzerland.+In+my+PhD+thesis+titled+%22Linked+Open+Usable+Data+for+Cultural+Heritage%22%2C+I+address+the+challenge+of+establishing+and+studying+stable+application+programming+interfaces+%28APIs%29+for+cultural+heritage+data.+This+endeavour+aims+to+enable+seamless+integration+and+interoperability%2C+thereby+fostering+collaboration+and+accessibility+across+the+domain.+However%2C+I+encounter+a+particular+hurdle+on+this+journey%2C+as+my+work+is+often+perceived+by+existing+infrastructures+as+a+service+rather+than+an+object+of+study.+During+the+Community+Practices+phase+of+my+research%2C+I+have+adopted+a+comprehensive+approach+that+combines+observations%2C+semi-structured+interviews+and+online+surveys.+This+interweaving+of+methods+allows+me+to+gain+valuable+insights.+I+am+also+actively+immersed+in+the+International+Image+Interoperability+Framework+%28IIIF%29+and+Linked+Art+communities%2C+using+an+Actor-Network+Theory+%28ANT%29+lens+to+unravel+the+intricate+dependencies+and+relationships+between+the+various+actors.+In+venturing+into+the+realm+of+semantic+interoperability%2C+I+have+embarked+on+a+journey+of+experimentation+with+modelling%2C+publishing+and+analysing+LOUD-compliant+resources%2C+with+a+key+focus+on+implementing+RESTful+APIs.+These+intertwined+perspectives+are+based+on+the+LOUD+design+principles+and+leverage+JSON-LD+as+a+serialisation+format%2C+ensuring+adherence+to+core+standards+such+as+the+IIIF+Presentation+API+3.0%2C+W3C+Web+Annotation+Data+Model%2C+and+Linked+Art+API.+My+dissertation+presents+a+compelling+set+of+use+cases+that+highlight+the+inherent+socio-technical+characteristics+of+grassroots+initiatives+and+the+way+they+create+and+maintain+specifications.+First%2C+within+the+confines+of+my+own+research%2C+I+endeavour+to+create+a+bespoke+data+model+that+is+firmly+rooted+in+LOUD+practices.+This+foundational+endeavour+strengthens+the+integrity+and+coherence+of+my+research+within+the+broader+landscape+of+the+cultural+heritage+field.+Secondly%2C+working+with+Participatory+Knowledge+Practices+in+Analogue+and+Digital+Image+Archives+%28PIA%29+as+a+dynamic+laboratory%2C+I+confront+the+intricacies+of+data+modelling%2C+drawing+on+practical+engagement+and+reflective+contemplation+to+refine+my+findings.+Finally%2C+an+incisive+analysis+of+LUX%2C+the+Yale+Collection+Discovery+platform%2C+provides+valuable+insights+into+the+effective+implementation+of+LOUD+standards+at+scale%2C+highlighting+the+nuances+of+data+consistency.+As+I+navigate+this+interdisciplinary+expedition%2C+I+encounter+the+intriguing+insight+that+both+community+practices+and+semantic+interoperability+are+intricately+intertwined.+Instead+of+being+distinct+and+isolated+domains%2C+they+reveal+themselves+as+interrelated+threads%2C+intricately+woven+together.+This+entanglement+reveals+the+fluidity+and+symbiosis+between+these+perspectives%2C+where+their+convergence+leads+to+a+more+holistic+understanding+of+the+intricate+fabric+of+cultural+heritage+data.+Traversing+this+distinctive+path%2C+I+grapple+with+the+captivating+challenge+of+establishing+LOUD+API+endpoints+%E2%80%94+a+challenge+diverging+from+conventional+research+subjects%2C+which+often+necessitates+self-reliance.+In+conclusion%2C+my+PhD+unfolds+as+a+journey+that+embraces+intertwined+socio-technical+perspectives%2C+showcasing+their+entanglement+rather+than+discrete+divisions.&amp;rft_id=https%3A%2F%2Fjulsraemy.ch%2Fprezi%2Floud-apis-studyday2023.html"></span>

<span class="Z3988" title="ctx_ver=Z39.88-2004&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Abook&amp;rft.genre=document&amp;rft.btitle=Cr%C3%A9er+des+API+ouvertes+-+les+pratiques+et+le+tissu+social+des+communaut%C3%A9s+IIIF+et+Linked+Art&amp;rft.au=Julien+A.+Raemy&amp;rft.date=2023-08-31&amp;rft.place=Geneva%2C+Switzerland&amp;rft.language=fr&amp;rft.description=Cette+pr%C3%A9sentation+a+%C3%A9t%C3%A9+r%C3%A9alis%C3%A9e+dans+le+cadre+de+la+journ%C3%A9e+LibreABC+qui+s%27est+d%C3%A9roul%C3%A9e+le+31+ao%C3%BBt+2023+au+Mus%C3%A9e+d%27ethnographie+de+Gen%C3%A8ve.+La+cr%C3%A9ation+et+la+maintenance+d%E2%80%99interfaces+de+programmation+applicative+%28API+-+application+programming+interface%29+ouvertes+et+partag%C3%A9es+est+une+pratique+courante+dans+le+d%C3%A9veloppement+de+logiciels+et+de+technologies+de+l%27information.+Les+communaut%C3%A9s+IIIF+%28International+Image+Interoperability+Framework+Consortium%29+et+Linked+Art+%E2%80%94+compos%C3%A9s+principalement+d%27individus+travaillant+dans+des+biblioth%C3%A8ques%2C+archives%2C+mus%C3%A9es+et+universit%C3%A9s+%E2%80%94+sont+des+exemples+de+communaut%C3%A9s+qui+ont+adopt%C3%A9+cette+pratique+avec+succ%C3%A8s.+Cela+favorise+la+collaboration+et+le+d%C3%A9veloppement+de+logiciels+compatibles%2C+tout+en+encourageant+la+transparence+et+l%27ouverture.+Les+membres+de+ces+communaut%C3%A9s+s%27engagent+%C3%A0+assurer+la+qualit%C3%A9+et+l%27interop%C3%A9rabilit%C3%A9+de+leurs+API+en+se+basant+sur+des+cas+pratiques+communs+et+sur+des+standards+web+ouverts.+Les+API+des+communaut%C3%A9s+IIIF+et+Linked+Art+pr%C3%A9sentent+un+potentiel+%C3%A9norme+pour+les+utilisateur%C2%B7rice%C2%B7x%C2%B7s%2C+qu%27iels+soient+universitaires+ou+membres+du+grand+public.+Gr%C3%A2ce+%C3%A0+ces+API%2C+les+utilisateur%C2%B7rice%C2%B7x%C2%B7s+peuvent+facilement+acc%C3%A9der+%C3%A0+des+collections+patrimoniales+num%C3%A9riques%2C+ce+qui+ouvre+de+nouvelles+opportunit%C3%A9s+pour+la+recherche%2C+l%27%C3%A9ducation+et+la+cr%C3%A9ativit%C3%A9.+En+fin+de+compte%2C+les+API+ouvertes+contribuent+%C3%A0+la+cr%C3%A9ation+d%27un+%C3%A9cosyst%C3%A8me+num%C3%A9rique+collaboratif+et+dynamique%2C+qui+peut+b%C3%A9n%C3%A9ficier+%C3%A0+la+soci%C3%A9t%C3%A9+dans+son+ensemble.&amp;rft_id=info%3Adoi%2F10.5281%2Fzenodo.8178671&amp;rft_id=https%3A%2F%2Fjulsraemy.ch%2Fprezi%2Flibreabc2023.html"></span>
<span class="Z3988" title="ctx_ver=Z39.88-2004&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Abook&amp;rft.genre=document&amp;rft.btitle=Situating+Interlinked+Cultural+Heritage+Data+on+the+Web&amp;rft.au=Julien+A.+Raemy&amp;rft.date=2023-08-31&amp;rft.place=Basel%2C+Switzerland&amp;rft.description=This+presentation+focuses+on+situating+data+produced+by+humans+and+nonhumans+engaged+in+the+cultural+heritage+field+and+published+on+the+Web+in+line+with+the+Open+Science+and+Citizen+Science+movements.+It+aims+to+map+the+associations+among+various+communities+of+practice%2C+particularly+within+libraries%2C+archives+and+museums%2C+and+the+precarious+balance+between+exhaustiveness+and+a+rigid+structure+of+data+description+versus+the+potential+for+multiplying+assertions%2C+bypassing+cataloguing+rules+and+their+underlying+postcolonial+constructs.+The+openness+and+interconnection+of+data+makes+it+possible+to+examine+the+form+of+description+as+well+as+the+method+of+publication%2C+and+inevitably+to+analyse+the+biases+linked+to+the+associated+vocabularies%2C+For+instance%2C+the+Web%2C+which+has+claimed+to+be+a+Semantic+Web+for+several+years+now%2C+has+a+centrepiece+known+as+Resource+Description+Framework+%28RDF%29%2C+a+general+method+for+describing+and+exchanging+graph+data+and+a+Web+standard+since+2004.+The+Semantic+Web+offers+major+opportunities+for+the+Humanities+because+it+allows+data+to+be+reasoned+together%2C+to+be+understood+by+machines+via+RDF-based+ontologies%2C+a+formal+way+to+represent+human-like+knowledge.+Developing+infrastructures%2C+or+sites+of+assemblage%2C+capable+of+creating+and+maintaining+RDF+statements+and+other+related+technologies+or+building+on+this+standard+to+interconnect+online+records+is+not+straightforward+and+requires+a+fair+amount+of+socio-technical+elements+to+be+implemented.+As+a+demonstration%2C+I+will+look+at+the+practices+of+two+community-driven+initiatives%2C+mainly+active+in+the+cultural+heritage+field%2C+through+an+Actor-Network+Theory+%28ANT%29+lens%2C+namely+the+International+Image+Interoperability+Framework+%28IIIF%29+and+Linked+Art%2C+which+have+developed+shared+specifications+and+related+services+on+agreed-upon+design+principles.&amp;rft_id=info%3Adoi%2F10.5281%2Fzenodo.8250117&amp;rft_id=https%3A%2F%2Fjulsraemy.ch%2Fprezi%2Fsts-ch-2023.html"></span>
