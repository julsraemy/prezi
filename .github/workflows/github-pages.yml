name: Build changed decks

# Rebuilds the HTML (with its Google Scholar / Zotero citation tags) and link
# preview image of each deck edited in md/, regenerates the index page's
# metadata (_includes/head-custom.html), and commits them back to master,
# which GitHub Pages then publishes as usual. Other decks are left untouched.
# Run it by hand (Actions > Build changed decks > Run workflow) to rebuild every
# deck, e.g. after upgrading Marp CLI or changing a theme.

on:
  push:
    branches:
      - master
    paths:
      - 'md/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-decks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build changed decks
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # The hosted runners' preinstalled Chrome cannot use its sandbox
          CHROME_NO_SANDBOX: 1
          LANG: en-GB
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            changed=$(ls md/*.md)
          else
            changed=$(git diff --name-only --diff-filter=d "$BEFORE" "$AFTER" -- 'md/*.md')
          fi
          for deck in $changed; do
            npx marp --html --no-stdin "$deck" -o "$(basename "${deck%.md}").html"
          done
          node scripts/citation-meta.js . $changed
          node scripts/index-meta.js
          node scripts/og-images.js assets/og $changed

      - name: Commit the results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' assets/og _includes
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild changed decks'
          git pull --rebase origin master
          git push origin HEAD:master
